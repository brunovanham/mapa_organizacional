# Roda os testes e publica a interface no GitHub Pages a cada push no branch padrão
# (quando o Pages está configurado com "Source: GitHub Actions"; no modo
# "Deploy from branch" o próprio GitHub publica e este job só confirma).
# Só publica o código (público). Os dados ficam num repositório PRIVADO separado.
name: Publicar interface (GitHub Pages)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publicar:
    needs: testes
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar se o GitHub Pages está ativado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "desativado")
          if [ "$tipo" = "workflow" ]; then
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          elif [ "$tipo" = "legacy" ]; then
            echo "::notice::O GitHub Pages publica direto do branch (Deploy from branch); nada a fazer aqui."
            echo "ativo=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages não está ativado. Ative em Settings → Pages."
            echo "ativo=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.ativo == 'true'
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ativo == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ativo == 'true'
        with:
          path: .
      - id: deployment
        if: steps.pages.outputs.ativo == 'true'
        uses: actions/deploy-pages@v4
